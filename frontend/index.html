<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Companion — say it, break it down</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F1F3EE; --surface: #FFFDF9; --ink: #232520; --ink-muted: #6B7268;
    --moss: #3F6653; --moss-dark: #2E4C3D; --amber: #C98A2C; --amber-dark: #A56F1E;
    --line: #DADFD5; --error: #B3432E;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Atkinson Hyperlegible', system-ui, sans-serif; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:32px 16px 40px; }
  .wrap { width:100%; max-width:620px; display:flex; flex-direction:column; height:calc(100vh - 72px); }
  .mark { font-family:'Fraunces', serif; font-weight:600; font-size:18px; color:var(--moss-dark); margin-bottom:20px; }

  /* chat feed */
  .feed { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding-bottom:16px; }
  .msg { max-width:85%; padding:14px 16px; border-radius:14px; line-height:1.55; font-size:16px; animation: rise 0.25s ease; }
  @keyframes rise { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .msg.user { align-self:flex-end; background:var(--moss); color:#F5F8F4; border-bottom-right-radius:3px; }
  .msg.assistant { align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:3px; }
  .msg .step-line { display:flex; gap:10px; margin-bottom:6px; }
  .msg .step-line:last-child { margin-bottom:0; }
  .step-num { flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--line); color:var(--ink-muted);
    font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .msg.assistant .step-num { background: var(--moss); color:#fff; }

  .done-btn { margin-top:10px; font-family:inherit; font-size:14px; font-weight:700; color:var(--moss-dark);
    background:transparent; border:1.5px solid var(--moss); border-radius:999px; padding:8px 16px; cursor:pointer; }
  .done-btn:hover { background:var(--moss); color:#fff; }
  .done-note { font-family:'Fraunces', serif; font-size:15px; color:var(--moss-dark); margin-top:8px; }

  /* input row */
  .input-row { display:flex; align-items:flex-end; gap:12px; border-top:2px solid var(--line); padding-top:12px; }
  #goal { flex:1; border:none; background:transparent; outline:none; resize:none; font-family:inherit; font-size:16px;
    color:var(--ink); line-height:1.4; padding:8px 0; min-height:26px; max-height:120px; }
  #goal::placeholder { color:#9AA096; }
  .mic-btn, .send-btn { flex-shrink:0; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .mic-btn { width:44px; height:44px; border-radius:50%; background:var(--amber); color:#FFF9EF; }
  .mic-btn:hover { background:var(--amber-dark); }
  .mic-btn.recording { background:var(--error); animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(179,67,46,0.45);} 70%{box-shadow:0 0 0 12px rgba(179,67,46,0);} 100%{box-shadow:0 0 0 0 rgba(179,67,46,0);} }
  .send-btn { height:44px; padding:0 18px; border-radius:999px; background:var(--moss); color:#F5F8F4; font-family:inherit; font-size:14px; font-weight:700; }
  .send-btn:hover:not(:disabled) { background:var(--moss-dark); }
  .send-btn:disabled { background:#B7C2BA; cursor:default; }
  .mic-btn svg { width:18px; height:18px; }

  .status { font-size:13px; color:var(--ink-muted); min-height:18px; margin-bottom:4px; }
  .status.error { color:var(--error); }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">companion</div>
  <div class="feed" id="feed">
    <div class="msg assistant">Hi! Tell me a goal or ask me anything — I'll break it into small, easy steps. 🌱</div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="input-row">
    <textarea id="goal" rows="1" placeholder="Type or speak — e.g. how do I make biryani"></textarea>
    <button class="mic-btn" id="micBtn" type="button" title="Record">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
    </button>
    <button class="send-btn" id="sendBtn" type="button">Send</button>
  </div>
</div>

<script>
  const API = "http://127.0.0.1:8000";

  const feedEl = document.getElementById('feed');
  const goalEl = document.getElementById('goal');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const statusEl = document.getElementById('status');

  // Chat memory - sent with every request so the assistant can answer follow-ups
  let history = [];          // [{role: "user"/"assistant", content: "..."}]
  let currentGoal = null;    // the active task's original text, used for "Done"
  let completedSteps = [];   // step texts done so far for the current task

  let isRecording = false, mediaRecorder, chunks = [];

  goalEl.addEventListener('input', () => {
    goalEl.style.height = 'auto';
    goalEl.style.height = Math.min(goalEl.scrollHeight, 120) + 'px';
  });

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', isError);
  }

  function scrollToBottom() {
    feedEl.scrollTop = feedEl.scrollHeight;
  }

  function addUserBubble(text) {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.textContent = text;
    feedEl.appendChild(div);
    scrollToBottom();
  }

  function addAssistantBubble(steps, isFinal, forDone) {
    const div = document.createElement('div');
    div.className = 'msg assistant';

    steps.forEach((s, i) => {
      const line = document.createElement('div');
      line.className = 'step-line';
      line.innerHTML = `<span class="step-num">${s.step ?? (i + 1)}</span><span>${escapeHtml(s.text ?? '')}</span>`;
      div.appendChild(line);
    });

    if (!isFinal) {
      const btn = document.createElement('button');
      btn.className = 'done-btn';
      btn.textContent = "Done — what's next?";
      btn.onclick = () => handleDone(btn);
      div.appendChild(btn);
    } else {
      const note = document.createElement('div');
      note.className = 'done-note';
      note.textContent = "That's everything — nicely done! 🎉";
      div.appendChild(note);
    }

    feedEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  async function callBackend(goal, resetTask) {
    if (resetTask) completedSteps = [];

    const res = await fetch(`${API}/decompose-task`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        goal,
        reading_level: "simple",
        max_steps: 3,
        tone: "encouraging",
        completed_steps: completedSteps,
        history,
      }),
    });
    if (!res.ok) throw new Error(`Server responded with ${res.status}`);
    return res.json();
  }

  // Sending a new message (typed or spoken) - could be a new goal, a question, or a follow-up
  async function sendMessage(text) {
    if (!text.trim()) return;
    addUserBubble(text);
    history.push({ role: "user", content: text });

    // A fresh message starts a new "task" for Done/completed_steps purposes
    currentGoal = text;
    setStatus('Thinking…');
    sendBtn.disabled = true;

    try {
      const data = await callBackend(text, true);
      const steps = data.steps || [];
      completedSteps = steps.map(s => s.text);
      addAssistantBubble(steps, data.is_final);
      history.push({ role: "assistant", content: steps.map(s => s.text).join(' ') });
      setStatus('');
    } catch (err) {
      setStatus("Couldn't reach the companion. Is the server running?", true);
    } finally {
      sendBtn.disabled = false;
    }
  }

  // "Done" button on a specific assistant bubble - continues the SAME task
  async function handleDone(btnEl) {
    btnEl.disabled = true;
    btnEl.textContent = "Getting the next steps…";
    setStatus('');

    try {
      const data = await callBackend(currentGoal, false);
      const newSteps = data.steps || [];
      completedSteps = completedSteps.concat(newSteps.map(s => s.text));
      btnEl.remove(); // remove old Done button, new one added on the new bubble
      addAssistantBubble(newSteps, data.is_final);
      history.push({ role: "assistant", content: newSteps.map(s => s.text).join(' ') });
    } catch (err) {
      setStatus("Couldn't reach the companion.", true);
      btnEl.disabled = false;
      btnEl.textContent = "Done — what's next?";
    }
  }

  sendBtn.addEventListener('click', () => {
    const text = goalEl.value.trim();
    goalEl.value = '';
    goalEl.style.height = 'auto';
    sendMessage(text);
  });

  goalEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });

  // --- voice input ---
  micBtn.addEventListener('click', async () => {
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        chunks = [];
        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        mediaRecorder.onstop = handleStop;
        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add('recording');
        setStatus('Listening…');
      } catch (err) {
        setStatus('Could not access the microphone.', true);
      }
    } else {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
      isRecording = false;
      micBtn.classList.remove('recording');
      setStatus('Transcribing…');
    }
  });

  async function handleStop() {
    const blob = new Blob(chunks, { type: 'audio/webm' });
    const formData = new FormData();
    formData.append('file', blob, 'recording.webm');
    try {
      const res = await fetch(`${API}/transcribe`, { method: 'POST', body: formData });
      if (!res.ok) throw new Error('transcribe failed');
      const data = await res.json();
      setStatus('');
      if (data.text) sendMessage(data.text);
      else setStatus("Didn't catch that — try again.", true);
    } catch (err) {
      setStatus('Could not transcribe that recording.', true);
    }
  }
</script>
</body>
</html>
